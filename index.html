<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#23868c"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Fisioapp"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<title>Fisioapp</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#f3f8f7;--sf:#fff;--card:#fff;--card2:#eaf3f2;--bd:#d7e6e4;--ac:#23868c;--act:#fff;--acd:rgba(35,134,140,.10);--tx:#17302f;--tx2:#4d6b69;--tx3:#8aa3a1;--red:#d0475a;--org:#d98a1f;--blue:#2f9e6a;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0c1514;--sf:#121e1d;--card:#162322;--card2:#1d2f2d;--bd:#2a413f;--ac:#5cc4bf;--act:#06201f;--acd:rgba(92,196,191,.13);--tx:#e9f4f2;--tx2:#a2bfbc;--tx3:#6f8b88;--red:#ff7b8a;--org:#f2b24c;--blue:#5fd49a}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);position:fixed;width:100%}
#app{height:100dvh;display:flex;flex-direction:column}
#top{background:var(--sf);border-bottom:1px solid var(--bd);padding:calc(var(--st) + 14px) 14px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#title{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title span{color:var(--ac)}
.bk{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx2);font-size:20px;cursor:pointer;display:none}
#main{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 28px;-webkit-overflow-scrolling:touch}
#nav{background:var(--sf);border-top:1px solid var(--bd);display:flex;padding:7px 0 calc(var(--sb) + 7px);flex-shrink:0}
.ni{flex:1;text-align:center;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--tx3);cursor:pointer;padding:3px}
.ni i{display:block;font-style:normal;font-size:20px;margin-bottom:1px}
.ni.on{color:var(--ac)}
h2{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:4px}
h3{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;margin-bottom:14px}
.sub{font-size:13px;color:var(--tx2);margin-bottom:14px}
.muted{font-size:12px;color:var(--tx3);line-height:1.5}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.ct{font-family:'Syne',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ac);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 10px}
.sv{font-family:'Syne',sans-serif;font-weight:800;font-size:20px}.sl{font-size:10.5px;color:var(--tx2);margin-top:2px}
.pc{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:9px;cursor:pointer}
.pc:active{border-color:var(--ac)}
.av{width:42px;height:42px;border-radius:12px;background:var(--acd);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Syne',sans-serif;flex-shrink:0}
.pn{font-weight:700;font-size:14px}.pm{font-size:11.5px;color:var(--tx2);margin-top:2px}
.chip{display:inline-flex;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--bd);color:var(--tx2);white-space:nowrap}
.chip.ok{color:var(--ac);border-color:var(--ac);background:var(--acd)}.chip.red{color:var(--red);border-color:var(--red)}.chip.blue{color:var(--blue);border-color:var(--blue)}.chip.org{color:var(--org);border-color:var(--org)}
.btn{padding:11px 16px;border-radius:11px;font-weight:700;font-size:13.5px;cursor:pointer;border:none;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.bp{background:var(--ac);color:var(--act)}.bg{background:var(--card2);color:var(--tx2);border:1px solid var(--bd)}.bo{background:transparent;color:var(--ac);border:1px solid var(--ac)}.bd2{background:transparent;color:var(--red);border:1px solid var(--red)}
.bf{width:100%}.bs{padding:6px 11px;font-size:12px;border-radius:8px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btns .btn{flex:1}
.fg{margin-bottom:11px;flex:1;min-width:0}
label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--tx2);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--tx);font-size:15px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;line-height:1.5}
input[type=range]{padding:0;height:34px;accent-color:var(--ac)}
input[type=checkbox]{width:auto}
.row{display:flex;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx3);font-weight:700;font-size:12.5px;cursor:pointer}
.tab.on{background:var(--acd);color:var(--ac);border-color:var(--ac)}
.fl{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto}
.ln{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}.ln:last-child{border:none}
.ln b{text-align:right}.ln span{color:var(--tx2)}
.soap{display:flex;gap:9px;margin-top:7px;font-size:13px;line-height:1.5}
.soap b{width:22px;height:22px;border-radius:6px;background:var(--acd);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:1px}
.soap span{white-space:pre-wrap;color:var(--tx)}
.rowc{background:var(--card2);border:1px solid var(--bd);border-radius:11px;padding:10px;margin-bottom:8px}
.rowc .row{margin-bottom:7px}.rowc .row:last-child{margin:0}
.rowc input,.rowc select{font-size:13.5px;padding:8px 10px}
.x{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:4px 8px}
.eva{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;line-height:1}
.bar{height:7px;border-radius:5px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
#ov.on{display:flex}
#md{background:var(--sf);border:1px solid var(--bd);border-radius:22px 22px 0 0;padding:20px 16px calc(var(--sb) + 20px);width:100%;max-width:640px;max-height:92vh;overflow-y:auto}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 80px);transform:translateX(-50%);background:var(--card2);border:1px solid var(--bd);padding:9px 16px;border-radius:11px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;white-space:nowrap}
#toast.on{opacity:1}
.empty{text-align:center;padding:40px 10px;color:var(--tx3)}.empty div{font-size:42px;margin-bottom:8px}
.wk{width:100%;min-width:540px;border-collapse:collapse;table-layout:fixed}.wk th,.wk td{border:1px solid var(--bd);padding:2px;vertical-align:top;font-size:10.5px}.wk th{background:var(--card2);font-size:10px;color:var(--tx2);padding:5px 2px}.wk th.td{color:var(--ac)}.wk td.hr{width:38px;color:var(--tx3);text-align:center;font-weight:700;cursor:default}.wk td{height:36px;cursor:pointer}
.ev{border-radius:5px;padding:2px 3px;margin-bottom:2px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid}.ev.rc{background:var(--acd);border-color:var(--ac);color:var(--ac)}.ev.ind{background:rgba(79,191,106,.16);border-color:var(--blue);color:var(--blue)}.ev.ok{background:var(--card2);border-color:var(--tx3);color:var(--tx3)}.ev.red{border-color:var(--red);color:var(--red)}.ev.mut{opacity:.4;border-color:var(--tx3)}
.wn{display:flex;align-items:center;gap:8px;margin-bottom:10px}.wn b{flex:1;text-align:center;font-size:13px}
#pv{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;padding-top:var(--st)}#pv.on{display:flex}.pvb{display:flex;gap:6px;padding:10px 12px;background:var(--sf);border-bottom:1px solid var(--bd)}.pvb .btn{padding:9px 10px;font-size:12.5px}#pvf{flex:1;border:0;background:#fff;width:100%}
.agt{border-collapse:separate;border-spacing:5px 6px;min-width:560px}.agt th{font-size:10.5px;color:var(--tx3);font-weight:700;letter-spacing:.5px;padding:2px 0;text-align:center;width:66px}.agt th.td{color:var(--ac)}.agt th small{display:block;font-size:11px}
.agt td{padding:0;vertical-align:middle}.agt td.nm{position:sticky;left:0;z-index:2;background:var(--bg);min-width:96px;max-width:96px;padding-right:4px}.agt .nm b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agt .nm i{display:block;font-style:normal;font-size:11px;color:var(--tx2);margin-bottom:4px}.agt .nm button{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx3);border-radius:8px;font-size:10px;padding:3px 0;font-family:inherit;cursor:pointer}
.sb{width:100%;min-height:46px;border-radius:10px;border:1.5px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:inherit;font-size:9.5px;font-weight:700;cursor:pointer;background:var(--card)}.sb b{font-size:17px;line-height:1.1}.sb:active{transform:scale(.95)}
.sb.rc{border-color:var(--ac);color:var(--ac);background:var(--acd)}.sb.ind{border-color:#4f9fd4;color:#4f9fd4;background:rgba(79,159,212,.14)}.sb.ok{border-color:var(--blue);color:var(--blue);background:rgba(79,191,106,.16)}.sb.red{border-color:var(--red);color:var(--red);background:rgba(255,107,107,.12)}.sb.mut{border-color:var(--bd);color:var(--tx3);opacity:.6}
.dsh{display:block;text-align:center;color:var(--tx3);padding:14px 0;font-size:14px}
.card,.stat,.pc{box-shadow:0 1px 3px rgba(20,70,70,.06)}.card{border-radius:16px}#top{box-shadow:0 1px 8px rgba(20,70,70,.06)}#lg{width:30px;height:30px;object-fit:contain}
@keyframes up{from{opacity:0;transform:translateY(8px)}}@keyframes sl{from{opacity:0;transform:translateY(28px)}}@keyframes grow{from{transform:scaleY(0)}}
#main.fx>*{animation:up .3s ease both}#main.fx>*:nth-child(2){animation-delay:.04s}#main.fx>*:nth-child(3){animation-delay:.08s}#main.fx>*:nth-child(n+4){animation-delay:.12s}
#ov.on #md{animation:sl .28s ease}.gb{transform-origin:bottom;animation:grow .6s ease both}.pc,.btn,.sb,.tab{transition:transform .12s,border-color .2s,background .2s}.pc:active{transform:scale(.985)}
#sp{position:fixed;inset:0;z-index:200;background:#f3f8f7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}#sp.out{opacity:0;pointer-events:none}#sp img{width:min(72vw,320px);animation:up .7s ease both}#sp i{font-style:normal;font-size:11px;letter-spacing:2px;color:#6a8a88;text-transform:uppercase}
.hero{background:linear-gradient(135deg,#1f7a80,#5fb89a);color:#fff;border-radius:18px;padding:16px 16px 14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(35,134,140,.25)}.hg{font-family:'Syne',sans-serif;font-weight:800;font-size:21px;margin:2px 0}
.dot{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--card)}.lg{display:flex;gap:12px;font-size:11px;color:var(--tx2);margin-bottom:10px}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.btns .bs{padding:10px 11px;font-size:13px}.bok{background:var(--blue);color:var(--act)}.bfa{background:var(--red);color:#fff}
.agt th.td{background:var(--ac);color:var(--act);border-radius:10px;padding:5px 0}.agt td.tdy{background:var(--acd);border-radius:12px;padding:3px}
.sb{min-height:54px;font-size:11px;border-width:1.5px}.sb b{font-size:19px}.sb.ok{background:var(--blue);border-color:var(--blue);color:var(--act)}.sb.red{background:var(--red);border-color:var(--red);color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mk{display:flex;flex-wrap:wrap;gap:6px}.mk span{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--tx3);background:var(--bg)}.mk span.on{background:var(--ac);border-color:var(--ac);color:var(--act)}.mk span.nx{border-color:var(--ac);color:var(--ac)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.pill{display:inline-flex;gap:6px;align-items:center;padding:9px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx2);font-weight:600;font-size:13px;cursor:pointer;transition:all .2s}.pill.on{border-color:var(--ac);background:var(--acd);color:var(--ac)}
@media(min-width:700px){#main{padding:20px calc(50% - 320px)}}
</style>
</head>

<div id="sp" onclick="fechaSp()"><img id="sp-i" alt="Dra. Samantha Saraiva"><i>Fisioterapia &amp; Longevidade</i></div>
<div id="app">
  <div id="top"><button class="bk" id="bk" onclick="back()">‹</button><img id="lg" alt=""><div id="title"></div></div>
  <div id="main"></div>
  <div id="nav">
    <div class="ni" data-v="hoje" onclick="go('hoje')"><i>🏠</i>Hoje</div>
    <div class="ni" data-v="home" onclick="go('home')"><i>🧑‍⚕️</i>Pacientes</div>
    <div class="ni" data-v="agenda" onclick="go('agenda')"><i>📅</i>Agenda</div>
    <div class="ni" data-v="fin" onclick="go('fin')"><i>💰</i>Financeiro</div>
    <div class="ni" data-v="cfg" onclick="go('cfg')"><i>⚙️</i>Ajustes</div>
  </div>
</div>
<div id="ov" onclick="if(event.target===this)closeModal()"><div id="md"></div></div>
<div id="pv"><div class="pvb"><button class="btn bg" onclick="fecharPront()">✕ Fechar</button><button class="btn bp" style="flex:1" onclick="zapPdf()">📄 Enviar PDF</button><button class="btn bo" onclick="zapTexto()">💬 Texto</button><button class="btn bg" onclick="imprimirPront()">🖨️</button></div><iframe id="pvf"></iframe></div>
<div id="toast"></div>
<datalist id="dl-adm"></datalist><datalist id="dl-tipo"><option value="Ortopédica"><option value="Neurológica"><option value="Esportiva"><option value="Pilates"><option value="RPG"><option value="Domiciliar"><option value="Respiratória"><option value="Reavaliação"></datalist>
<datalist id="dl-forca"></datalist>
<datalist id="dl-testes"></datalist>
<input type="file" id="bkfile" accept=".json" style="display:none" onchange="importar(event)"/>

const KEY='pfisio_db_v1';
let db=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.patients){d.recorr=d.recorr||[];d.lemb=d.lemb||{};d.desp=d.desp||[];return d}}catch(e){}return{patients:[],recorr:[],lemb:{},desp:[],settings:{nome:'',crefito:'',clinica:'',tel:''}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('⚠️ Não foi possível salvar (armazenamento cheio?)')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const v=id=>($(id)?.value||'').trim();
const brl=n=>'R$ '+(+n||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const iso=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=s=>s?s.split('-').reverse().join('/'):'';
const first=n=>(n||'').split(' ')[0];
const pat=id=>db.patients.find(p=>p.id===id);
const real=p=>p.sessoes.filter(s=>s.status==='realizada');
const usadas=(p,k,ex)=>p.sessoes.filter(s=>s.status==='realizada'&&s.pacoteId===k.id&&s.id!==ex).length;
const pacoteAtivo=p=>p.pacotes.find(k=>usadas(p,k)<k.total);
const devedor=p=>p.sessoes.filter(s=>s.status==='realizada'&&!s.pago&&s.valor>0).reduce((n,s)=>n+s.valor,0)+p.pacotes.filter(k=>!k.pago).reduce((n,k)=>n+k.valor,0)+mensaisAbertos(p).length*(p.mensal?.valor||0);
function idade(n){if(!n)return'';const d=new Date(n+'T00:00'),a=new Date();let i=a.getFullYear()-d.getFullYear();if(a<new Date(a.getFullYear(),d.getMonth(),d.getDate()))i--;return i+' anos'}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function openModal(h){$('md').innerHTML=h;$('ov').classList.add('on')}
function closeModal(){$('ov').classList.remove('on')}
function wa(tel,msg){let n=(tel||'').replace(/\D/g,'');if(n&&n.length<=11)n='55'+n;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank')}
const field=(id,l,val='',type='text',ex='')=>`<div class="fg"><label>${l}</label><input id="${id}" type="${type}" value="${esc(val)}" ${ex}></div>`;
const area=(id,l,val='',rows=3,ph='')=>`<div class="fg"><label>${l}</label><textarea id="${id}" rows="${rows}" placeholder="${esc(ph)}">${esc(val)}</textarea></div>`;
const opts=(arr,cur)=>arr.map(o=>{const[val,lb]=Array.isArray(o)?o:[o,o];return`<option value="${esc(val)}" ${cur===val?'selected':''}>${esc(lb)}</option>`}).join('');

const S={view:'hoje',hd:0,pid:null,tab:'resumo',q:'',f:'todos',aid:null,ag:'sem',wk:0,sx:null,flt:{rc:1,ind:1,ok:1,red:1},mes:iso().slice(0,7)};
let D=null; // rascunho da avaliação em edição
function go(view,o={}){Object.assign(S,{view},o);render();const mm=$('main');mm.classList.remove('fx');void mm.offsetWidth;mm.classList.add('fx');$('main').scrollTop=0}
function back(){if(S.view==='aval'){D=null;go('pac',{tab:'aval'})}else go('home')}
function render(){
  const m=$('main'),st=m.scrollTop;
  const views={hoje:viewHoje,home:viewHome,agenda:viewAgenda,fin:viewFin,cfg:viewCfg,pac:viewPac,aval:viewAval};
  m.innerHTML=views[S.view]();
  m.scrollTop=st;
  const aw=$('agw');if(aw)aw.scrollLeft=S.sx==null?Math.max(0,(+aw.dataset.t-1)*66):S.sx;
  const base=(S.view==='pac'||S.view==='aval')?'home':S.view;
  document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('on',n.dataset.v===base));
  const sub=S.view==='pac'||S.view==='aval';
  $('bk').style.display=sub?'block':'none';$('lg').style.display=sub?'none':'block';
  const t={hoje:'Fisio<span>app</span>',home:'Pacientes',agenda:'Agenda',fin:'Financeiro',cfg:'Ajustes',pac:esc(pat(S.pid)?.nome||''),aval:S.aid?'Editar avaliação':'Nova avaliação'};
  $('title').innerHTML=t[S.view];

const AVC=['#23868c','#3f9d74','#4a8fc7','#8a7fc4','#d9873f','#cf6b86'];

function av(p){let h=0;for(const c of p.nome)h=(h*31+c.charCodeAt(0))%97;const c=AVC[h%AVC.length],st=p.status==='alta'?['var(--tx3)','Alta']:temPend(p)?['var(--org)','Com pendência']:['var(--blue)','Em tratamento'];

  return l.map(p=>{const d=devedor(p),n=real(p).length;
    return`<div class="pc" onclick="go('pac',{pid:'${p.id}',tab:'resumo'})">${av(p)}

}

function pacModal(pid){

  openModal(`<h3>${pid?'Editar cadastro':'Novo paciente'}</h3>
  ${field('c_nome','Nome completo *',p.nome)}

  ${field('c_med','Médico encaminhador',p.medico)}

  <div class="btns"><button class="btn bg" onclick="closeModal()">Cancelar</button><button class="btn bp" style="flex:2" onclick="salvarPac('${pid||''}')">Salvar</button></div>`);cCalc();

const mk=(p,k)=>{const u=usadas(p,k);return`<div class="mk">${Array.from({length:Math.min(k.total,60)},(_,i)=>`<span class="${i<u?'on':i===u?'nx':''}">${i<u?'✓':i+1}</span>`).join('')}</div>`};
function mesesDevidos(p){if(p.tipoCobranca!=='mensal'||!p.mensal)return[];const fim=(p.status==='alta'&&p.plano.alta?.data||iso()).slice(0,7),o=[];for(let m=p.mensal.ini;m<=fim&&o.length<120;m=mesAdd(m,1))o.push(m);return o}
const mensaisAbertos=p=>mesesDevidos(p).filter(m=>!(p.mensalPag||{})[m]);
function cobBlock(p){const tp=p.tipoCobranca||'sessao',ed=p.id?1:'',g=k=>tp===k?'block':'none',mi=p.mensal?.ini?p.mensal.ini+'-01':iso();

  <div id="c_p" style="display:${g('pacote')}"><div class="row">${field('c_pq','Sessões no pacote',p.pacoteQtd||'','number','inputmode="numeric" placeholder="Ex: 10" oninput="cCalc()"')}${field('c_pv','Valor do pacote (R$)',p.pacoteValor||'','number','step="0.01" inputmode="decimal" placeholder="Ex: 1000,00" oninput="cCalc()"')}</div>
    <div id="c_gp" style="${ed?'display:none':''}">${field('c_pi','Início do pacote',iso(),'date')}<label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px;margin-bottom:8px"><input type="checkbox" id="c_pp"> Pacote já foi pago</label></div>
    <div class="muted" id="c_hint"></div><div id="c_mk" class="mk" style="margin-top:8px"></div></div>

function cTipo(k){$('c_tipo').value=k;document.querySelectorAll('#md .pill[data-k]').forEach(e=>e.classList.toggle('on',e.dataset.k===k));$('c_s').style.display=k==='sessao'?'block':'none';$('c_p').style.display=k==='pacote'?'block':'none';$('c_m').style.display=k==='mensal'?'block':'none';cCalc()}
function cCalc(){const n=+v('c_pq')||0,val=+v('c_pv')||0;

function cobr(pid){const p0=pid?pat(pid):{},tp=v('c_tipo')||'sessao',vs=+v('c_vs')||0,q=+v('c_pq')||0,pv=+v('c_pv')||0,mv=+v('c_mv')||0;

function novoPacote(p,pago){if(p.tipoCobranca!=='pacote'||!p.pacoteQtd)return;const di=v('c_pi')||iso();p.pacotes.push({id:uid(),nome:'Pacote '+p.pacoteQtd+' sessões',total:p.pacoteQtd,valor:p.pacoteValor||0,data:di,pago,pagoEm:pago?(di<=iso()?di:iso()):null,forma:'Pix'})}

  else if(tp==='mensal'){const m=iso().slice(0,7),x=(p.mensalPag||{})[m];b=`<div class="ln"><span>Mensalidade</span><b>${brl(p.mensal?.valor)} · vence dia ${p.mensal?.dia}</b></div><div class="ln" style="align-items:center"><span>${m.slice(5)}/${m.slice(0,4)}</span>${x?'<span class="chip blue">Pago</span>':`<button class="btn bp bs" onclick="pagarModal('mes','${p.id}','${m}')">Receber</button>`}</div>`}

function salvarPac(pid){

// ═══════════ AVALIAÇÃO (EVA, ADM, força, testes) ═══════════

function chart(p){

  <polyline fill="none" stroke="var(--ac)" stroke-width="2.2" stroke-linejoin="round" points="${pts.map((q,i)=>x(i)+','+y(q.v)).join(' ')}"/>
  ${pts.map((q,i)=>`<circle cx="${x(i)}" cy="${y(q.v)}" r="3.5" fill="var(--ac)"/>${pts.length<=10?`<text x="${x(i)}" y="${y(q.v)-7}" text-anchor="middle" font-size="9" fill="var(--tx2)">${q.v}</text>`:''}`).join('')}
  <text x="${pl}" y="${H-5}" font-size="9" fill="var(--tx3)">${dm(pts[0].d)}</text><text x="${W-pr}" y="${H-5}" text-anchor="end" font-size="9" fill="var(--tx3)">${dm(pts[pts.length-1].d)}</text></svg>`;
}
const ESC={tug:{n:'TUG — Timed Up and Go',u:'s',b:'TUG'},berg:{n:'Escala de Equilíbrio de Berg',u:'/56',b:'Berg'},sl30:{n:'Sentar e levantar 30 s',u:'rep',b:'Sentar-levantar 30s'},pre:{n:'Força de preensão (dinamometria)',u:'kgf',b:'Preensão'}};
const BERG=['Sentado para em pé','Em pé sem apoio','Sentado sem apoio nas costas','Em pé para sentado','Transferências','Em pé com olhos fechados','Em pé com pés juntos','Alcançar à frente com braço estendido','Pegar objeto do chão','Virar-se para olhar para trás','Girar 360°','Alternar os pés no degrau','Em pé com um pé à frente (tandem)','Em pé sobre uma perna'];
const SL30={M:[[60,14],[65,12],[70,12],[75,11],[80,10],[85,8],[90,7]],F:[[60,12],[65,11],[70,10],[75,10],[80,9],[85,8],[90,4]]};
function escInt(p,e){const x=e.v;
  if(e.t==='tug')return x>=20?['Mobilidade reduzida','red']:x>=12?['Risco de queda (≥12 s)','org']:x>=10?['Limítrofe','org']:['Normal','blue'];
  if(e.t==='berg')return x<=20?['Alto risco de queda','red']:x<=40?['Risco moderado','org']:x<45?['Atenção (<45)','org']:['Baixo risco','blue'];
  if(e.t==='sl30'){const a=parseInt(idade(p.nasc)),g=p.sexo==='Masculino'?'M':p.sexo==='Feminino'?'F':null;if(!g||!(a>=60))return['Ref. para ≥ 60 anos (informe sexo e nascimento)',''];let c=0;SL30[g].forEach(([i,t])=>{if(a>=i)c=t});return x<c?['Abaixo da média (<'+c+')','red']:['Dentro do esperado','blue']}
  const g=p.sexo==='Masculino'?27:p.sexo==='Feminino'?16:0;return g?(x<g?['Força baixa (<'+g+' kgf)','red']:['Adequada','blue']):['Informe o sexo no cadastro','']}
function lineChart(pts){if(pts.length<2)return'<div class="muted" style="margin:6px 0">O gráfico aparece a partir do 2º registro.</div>';
  const vs=pts.map(q=>q.v),mn=Math.min(...vs),mx=Math.max(...vs),W=320,H=120,pl=14,pr=14,pt=16,pb=20,rg=mx-mn||1,x=i=>pl+i*(W-pl-pr)/(pts.length-1),y=n=>pt+(mx-n)*(H-pt-pb)/rg,dm=t=>t.slice(8)+'/'+t.slice(5,7);

function tabEsc(p){
  const E=(p.escalas||[]).slice().sort((a,b)=>a.data<b.data?-1:1);

function sessCard(p,s){

function openSessao(pid,sid,agendar,quick){

  const cob=s?(s.cortesia?'cortesia':s.pacoteId||(s.mens?'mensal':'avulsa')):(pkDefault||(p.tipoCobranca==='mensal'?'mensal':'avulsa'));

  const ultimo=[...real(p)].sort((a,b)=>a.data<b.data?1:-1)[0];

  <option value="mensal" ${cob==='mensal'?'selected':''}>Mensalidade (já inclusa)</option><option value="cortesia" ${cob==='cortesia'?'selected':''}>Cortesia</option></select></div>

}
function salvarSessao(pid,sid){
  const p=pat(pid),old=sid?p.sessoes.find(x=>x.id===sid):null;
  if(!v('s_data'))return toast('⚠️ Informe a data');
  const status=v('s_st');
  const r={id:old?.id||uid(),data:v('s_data'),hora:v('s_hora'),status,S:v('s_S'),O:v('s_O'),A:v('s_A'),P:v('s_P'),eva:v('s_eva')===''?null:+v('s_eva'),tipo:v('s_tipo'),dur:+v('s_du')||50};
  if(status==='realizada'){
    const c=v('s_cobr');
    if(c==='cortesia'){r.cortesia=true;r.valor=0;r.pago=true}
    else if(c==='mensal'){r.mens=true;r.valor=0;r.pago=true}
    else if(c==='avulsa'){r.valor=+v('s_valor')||0;r.pago=$('s_pago').checked;r.forma=v('s_forma');if(r.pago)r.pagoEm=old?.pagoEm||iso()}
    else{r.pacoteId=c;r.valor=0;r.pago=true}
  }else{r.valor=0;r.pago=true;r.eva=null}
  if(old)Object.assign(old,{mens:undefined,pacoteId:undefined,cortesia:undefined,pagoEm:undefined,forma:undefined},r);else p.sessoes.push(r);
  save();closeModal();render();toast('✅ Sessão salva');
}
function excluirSessao(pid,sid){if(!confirm('Excluir esta sessão?'))return;const p=pat(pid);const x=p.sessoes.find(q=>q.id===sid);if(x&&x.rec){const r=db.recorr.find(q=>q.id===x.rec);if(r)(r.skip=r.skip||[]).push(x.data)}p.sessoes=p.sessoes.filter(s=>s.id!==sid);save();closeModal();render()}

function recebimentos(p){const r=[];p.sessoes.forEach(s=>{if(s.status==='realizada'&&s.pago&&s.valor>0&&s.pagoEm)r.push({d:s.pagoEm,v:s.valor,f:s.forma,t:'Sessão '+fmtD(s.data),n:p.nome,pid:p.id,k:s.tipo||'Sem classificação'})});p.pacotes.forEach(k=>{if(k.pago&&k.pagoEm)r.push({d:k.pagoEm,v:k.valor,f:k.forma,t:'Pacote '+k.nome,n:p.nome,pid:p.id,k:'Pacotes'})});Object.entries(p.mensalPag||{}).forEach(([m,x])=>r.push({d:x.pagoEm,v:x.v,f:x.forma,t:'Mensalidade '+m.slice(5)+'/'+m.slice(0,4),n:p.nome,pid:p.id,k:'Mensalidades'}));return r}

  ${d>0?`<button class="btn bo bf" style="margin-bottom:12px" onclick="wa('${esc(p.tel)}','Olá, ${esc(first(p.nome))}! Passando para combinar o pagamento em aberto das sessões de fisioterapia: ${brl(d)}. Obrigada! 😊')">💬 Enviar cobrança por WhatsApp</button>`:''}
  ${mensalCard(p)}<div class="card"><div class="ct">📦 Pacotes <button class="btn bg bs" onclick="pacoteModal('${p.id}')">＋ Pacote</button></div>
  ${p.pacotes.length?p.pacotes.map(k=>{const u=usadas(p,k);return`<div style="padding:9px 0;border-bottom:1px solid var(--bd)"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b style="font-size:13.5px">${esc(k.nome)}</b><div class="muted">${u}/${k.total} sessões · ${brl(k.valor)}</div></div>
  ${k.pago?`<span class="chip ok" style="cursor:pointer" onclick="desfazPago('pacote','${p.id}','${k.id}')">Pago ${fmtD(k.pagoEm)}</span>`:`<button class="btn bp bs" onclick="pagarModal('pacote','${p.id}','${k.id}')">Receber</button>`}<button class="x" onclick="rmPacote('${p.id}','${k.id}')">✕</button></div><div style="margin-top:8px">${mk(p,k)}</div></div>`}).join(''):`<div class="muted">Nenhum pacote. ${p.pacoteQtd?'Use “＋ Pacote” para vender o pacote padrão.':''}</div>`}</div>
  <div class="card"><div class="ct">Sessões avulsas em aberto</div>${pend.length?pend.map(s=>`<div class="ln" style="align-items:center"><span>${fmtD(s.data)}</span><b>${brl(s.valor)}</b><button class="btn bp bs" onclick="pagarModal('sessao','${p.id}','${s.id}')">Receber</button></div>`).join(''):`<div class="muted">Nada em aberto. ✅</div>`}</div>`;
}
function pacoteModal(pid){const p=pat(pid);openModal(`<h3>Novo pacote</h3>${field('k_n','Nome',p.pacoteQtd?`Pacote ${p.pacoteQtd} sessões`:'Pacote de sessões')}
  <div class="row">${field('k_q','Nº de sessões',p.pacoteQtd||'','number','inputmode="numeric"')}${field('k_v','Valor total (R$)',p.pacoteValor||'','number','step="0.01" inputmode="decimal"')}</div>

const PAL=['#23868c','#6cc3a0','#4a8fc7','#8a7fc4','#e0a458','#d4768a','#9aa9a6'];
function donut(l,tot){
  if(!l.length||!tot)return'<div class="muted">Sem recebimentos neste mês.</div>';

  const seg=l.map(([k,x],i)=>{const len=x/tot*C,e=`<circle cx="60" cy="60" r="40" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;return e}).join('');
  return`<div style="display:flex;gap:14px;align-items:center"><svg viewBox="0 0 120 120" style="width:124px;flex-shrink:0">${seg}<text x="60" y="58" text-anchor="middle" font-size="9" fill="var(--tx3)">total</text><text x="60" y="73" text-anchor="middle" font-size="13" font-weight="700" fill="var(--tx)">${kfmt(tot)}</text></svg>
  <div style="flex:1;min-width:0">${l.map(([k,x],i)=>`<div class="ln" style="align-items:center"><span style="display:flex;gap:7px;align-items:center;min-width:0"><i style="width:10px;height:10px;border-radius:50%;background:${PAL[i%PAL.length]};flex-shrink:0"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span></span><b>${brl(x)} · ${Math.round(x/tot*100)}%</b></div>`).join('')}</div></div>`}

const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const mesAdd=(m,n)=>iso(new Date(+m.slice(0,4),+m.slice(5)-1+n,1)).slice(0,7);
const mesLb=m=>MESES[+m.slice(5)-1]+'/'+m.slice(2,4);
const kfmt=n=>n>=1000?(n/1000).toFixed(1).replace('.',',')+'k':String(Math.round(n));
function viewFin(){
  const m=S.mes;let rec=[];db.patients.forEach(p=>rec=rec.concat(recebimentos(p)));
  const sum=mm=>rec.filter(r=>r.d.startsWith(mm)).reduce((n,r)=>n+r.v,0);
  const rm=rec.filter(r=>r.d.startsWith(m)).sort((a,b)=>a.d<b.d?1:-1);
  const total=sum(m),ant=sum(mesAdd(m,-1)),dev=db.patients.map(p=>({p,d:devedor(p)})).filter(x=>x.d>0).sort((a,b)=>b.d-a.d);

  const grp=f=>{const o={};rm.forEach(r=>{const k=f(r);o[k]=(o[k]||0)+r.v});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
  const share=l=>l.length?l.map(([k,x])=>{const pc=total?Math.round(x/total*100):0;return`<div class="ln"><span>${esc(k)}</span><b>${brl(x)} · ${pc}%</b></div><div class="bar" style="margin:-4px 0 6px"><i style="width:${pc}%"></i></div>`}).join(''):'<div class="muted">Sem recebimentos neste mês.</div>';
  const pp=db.patients.map(p=>({p,r:rm.filter(x=>x.pid===p.id).reduce((n,x)=>n+x.v,0),n:real(p).filter(s=>s.data.startsWith(m)).length,a:devedor(p)})).filter(x=>x.r||x.n||x.a).sort((a,b)=>b.r-a.r);
  const ms=[-5,-4,-3,-2,-1,0].map(i=>mesAdd(m,i)),vals=ms.map(sum),mx=Math.max(...vals,1);
  const varp=ant?Math.round((total-ant)/ant*100):null;
  const dm=despMes(m),dt=dm.reduce((n,x)=>n+x.valor,0),dcat=(()=>{const o={};dm.forEach(x=>o[x.cat]=(o[x.cat]||0)+x.valor);return Object.entries(o).sort((a,b)=>b[1]-a[1])})(),lucro=total-dt;
  const ft=db.patients.map(p=>({p,...faltas(p,m)})),tf=ft.reduce((a,x)=>({f:a.f+x.f,t:a.t+x.t}),{f:0,t:0}),tpc=tf.t?Math.round(tf.f/tf.t*100):0,fl=ft.filter(x=>x.f).sort((a,b)=>b.f-a.f);
  return`<div class="wn"><button class="btn bg bs" onclick="S.mes=mesAdd(S.mes,-1);render()">‹</button><b>${MESES[+m.slice(5)-1]} de ${m.slice(0,4)}</b><button class="btn bg bs" onclick="S.mes=mesAdd(S.mes,1);render()">›</button></div>
  <div class="stats"><div class="stat"><div class="sv" style="color:var(--ac);font-size:16px;padding-top:2px">${brl(total)}</div><div class="sl">Recebido${varp!==null?` · <span style="color:${varp>=0?'var(--blue)':'var(--red)'}">${varp>=0?'▲':'▼'}${Math.abs(varp)}%</span>`:''}</div></div>
  <div class="stat"><div class="sv" style="color:var(--red);font-size:16px;padding-top:2px">${brl(dev.reduce((n,x)=>n+x.d,0))}</div><div class="sl">A receber (total)</div></div>
  <div class="stat"><div class="sv">${sessMes}</div><div class="sl">Sessões no mês</div></div></div>
  <div class="card"><div class="ct">📊 Resultado do mês</div><div class="ln"><span>Recebido</span><b style="color:var(--blue)">${brl(total)}</b></div><div class="ln"><span>Despesas</span><b style="color:var(--red)">− ${brl(dt)}</b></div><div class="ln"><span style="font-weight:700;color:var(--tx)">Lucro</span><b style="font-size:17px;color:${lucro>=0?'var(--blue)':'var(--red)'}">${brl(lucro)}</b></div></div>
  <div class="card"><div class="ct">Recebido nos últimos 6 meses</div><div style="display:flex;align-items:flex-end;height:120px">${ms.map((x,i)=>`<div style="flex:1;text-align:center;font-size:10px;color:var(--tx2)">${vals[i]?kfmt(vals[i]):''}<div class="gb" style="height:${Math.max(4,vals[i]/mx*80)}px;background:${x===m?'linear-gradient(var(--ac),#6cc3a0)':'var(--bd)'};border-radius:10px 10px 4px 4px;margin:2px 7px 0"></div><div style="color:var(--tx3);margin-top:3px">${mesLb(x)}</div></div>`).join('')}</div></div>
  <div class="card"><div class="ct">Por tipo de atendimento</div>${donut(grp(r=>r.k),total)}<div class="muted">Pacotes entram juntos, na data do pagamento. Defina o tipo ao registrar cada sessão.</div></div>

  <div class="card"><div class="ct">💸 Despesas do mês <button class="btn bg bs" onclick="despModal()">＋ Despesa</button></div>${dm.length?donut(dcat,dt)+'<div style="margin-top:10px">'+dm.slice().sort((a,b)=>b.valor-a.valor).map(x=>`<div class="ln" style="align-items:center"><span style="color:var(--tx)">${esc(x.desc||x.cat)}${x.fixa?' 🔁':''}<br><small style="color:var(--tx3)">${esc(x.cat)}${x.fixa?' · fixa mensal':' · '+fmtD(x.data)}</small></span><b>${brl(x.valor)}</b><button class="x" onclick="rmDesp('${x.id}')">✕</button></div>`).join('')+'</div>':'<div class="muted">Nenhuma despesa neste mês. Lance aluguel, material, deslocamento…</div>'}</div>
  <div class="card"><div class="ct">🚫 Taxa de faltas no mês</div><div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px"><span class="eva" style="color:${tpc>=20?'var(--red)':tpc>=10?'var(--org)':'var(--ac)'}">${tpc}%</span><span class="muted">${tf.f} falta(s) em ${tf.t} atendimento(s) marcados</span></div>${fl.length?fl.map(x=>`<div class="ln"><span style="color:var(--tx)">${esc(x.p.nome)}</span><b>${x.f}/${x.t} · ${x.pc}%</b></div>`).join(''):'<div class="muted">Nenhuma falta neste mês. ✅</div>'}</div>

  <div class="card"><div class="ct">🛡️ Backup dos dados</div><div class="muted" style="margin-bottom:12px">Os dados ficam guardados somente neste aparelho/navegador. Baixe um backup com frequência e guarde em local seguro — se o navegador for limpo ou o celular trocado, sem backup tudo se perde.</div>
  <div class="btns" style="margin:0"><button class="btn bp" onclick="exportar()">⬇️ Baixar backup</button><button class="btn bg" onclick="$('bkfile').click()">⬆️ Restaurar</button></div></div>
  <div class="card"><div class="ct">🔒 Privacidade (LGPD)</div><div class="muted">Prontuários são dados sensíveis de saúde. Mantenha o aparelho protegido por senha/biometria, guarde os backups com cuidado e colete o consentimento do paciente (campo disponível no cadastro).</div></div>`;
}
function salvarCfg(){db.settings={nome:v('t_nome'),crefito:v('t_cr'),tel:v('t_tel'),clinica:v('t_cl'),dur:+v('t_dur')||50};save();toast('✅ Salvo')}
function exportar(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fisioapp-backup-'+iso()+'.json';document.body.appendChild(a);a.click();a.remove();toast('⬇️ Backup baixado')}
async function importar(e){const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(!d.patients)throw 0;if(!confirm('Restaurar substitui TODOS os dados atuais pelos do arquivo. Continuar?'))return;db=d;db.recorr=db.recorr||[];db.lemb=db.lemb||{};db.desp=db.desp||[];save();toast('✅ Backup restaurado');go('home')}catch(x){toast('❌ Arquivo inválido')}}
function imprimir(pid){
  const p=pat(pid),s=db.settings,pl=p.plano;
  const sec=(t,b)=>b?`<h2>${t}</h2>${b}`:'';
  const kv=(k,val)=>val?`<p><b>${k}:</b> ${esc(val)}</p>`:'';
  const avs=[...p.avaliacoes].sort((a,b)=>a.data<b.data?-1:1).map(a=>`<h3>${esc(a.tipo)} — ${fmtD(a.data)} · EVA ${a.eva??'—'}/10 ${esc(a.evaLocal)}</h3>${kv('Inspeção',a.inspecao)}${kv('Palpação',a.palpacao)}
  ${a.adm.length?`<table><tr><th>ADM</th><th>Lado</th><th>Ativa</th><th>Passiva</th><th>Ref.</th></tr>${a.adm.map(r=>`<tr><td>${esc(r.mov)}${r.dor?' (dor)':''}</td><td>${esc(r.lado)}</td><td>${esc(r.ativa)}°</td><td>${esc(r.passiva)}°</td><td>${esc(r.ref)}°</td></tr>`).join('')}</table>`:''}
  ${a.forca.length?`<table><tr><th>Força</th><th>Lado</th><th>Grau</th></tr>${a.forca.map(r=>`<tr><td>${esc(r.musculo)}</td><td>${esc(r.lado)}</td><td>${esc(r.grau)}/5</td></tr>`).join('')}</table>`:''}
  ${a.testes.length?`<table><tr><th>Teste</th><th>Lado</th><th>Resultado</th><th>Obs.</th></tr>${a.testes.map(r=>`<tr><td>${esc(r.nome)}</td><td>${esc(r.lado)}</td><td>${esc(r.res)}</td><td>${esc(r.obs)}</td></tr>`).join('')}</table>`:''}${kv('Funcional',a.funcional)}${kv('Obs.',a.obs)}`).join('');
  const sess=[...real(p)].sort((a,b)=>a.data<b.data?-1:1).map(x=>`<div class="s"><b>${fmtD(x.data)} ${esc(x.hora||'')}${x.eva!=null?' · EVA '+x.eva:''}</b>${['S','O','A','P'].filter(k=>x[k]).map(k=>`<p><b>${k}:</b> ${esc(x[k])}</p>`).join('')}</div>`).join('');
  const metas=pl.metas.map(g=>`<li>${esc(g.texto)} — <i>${MS[g.status][0]}</i></li>`).join('');
  const al=pl.alta;
  const h=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Prontuário — ${esc(p.nome)}</title><style>body{font-family:Arial,sans-serif;color:#111;max-width:800px;margin:0 auto;padding:24px;font-size:13px;line-height:1.5}h1{font-size:20px;margin-bottom:2px}h2{font-size:14px;border-bottom:2px solid #23868c;color:#23868c;margin:22px 0 8px;padding-bottom:3px;text-transform:uppercase}h3{font-size:13px;margin:12px 0 4px}table{width:100%;border-collapse:collapse;margin:6px 0}th,td{border:1px solid #ccc;padding:4px 7px;text-align:left;font-size:12px}th{background:#e6f2f1}p{margin:3px 0}.s{border-left:3px solid #23868c;padding-left:10px;margin:10px 0;page-break-inside:avoid}.hd{display:flex;justify-content:space-between;border-bottom:1px solid #999;padding-bottom:8px}.bt{margin-bottom:14px}@media print{.bt{display:none}}</style></head><body>
  
  <div class="hd"><div style="display:flex;gap:12px;align-items:center"><img src="${LOGO_FULL}" style="height:62px"><div><h1>${esc(s.clinica||'Prontuário de Fisioterapia')}</h1><div>${esc(s.nome)}${s.crefito?' · CREFITO '+esc(s.crefito):''}${s.tel?' · '+esc(s.tel):''}</div></div></div><div style="text-align:right">Emitido em ${fmtD(iso())}</div></div>
  <h2>Identificação</h2><p><b>${esc(p.nome)}</b> ${idade(p.nasc)?'· '+idade(p.nasc):''} ${p.sexo?'· '+esc(p.sexo):''}</p>${kv('Profissão',p.prof)}${kv('Telefone',p.tel)}${kv('Diagnóstico médico',p.dxMedico)}${kv('Encaminhador',p.medico)}${kv('Alertas',p.alerta)}
  ${sec('Anamnese',kv('Queixa principal',p.queixa)+kv('HDA',p.hda)+kv('Antecedentes',p.ant)+kv('Medicamentos',p.meds))}
  ${sec('Avaliações',avs)}
  ${sec('Escalas funcionais',escHtml(p))}
  ${sec('Plano de tratamento',kv('Diagnóstico fisioterapêutico',pl.dx)+kv('Objetivo geral',pl.obj)+kv('Condutas',pl.cond)+kv('Frequência',pl.freq?pl.freq+'x/semana':'')+kv('Sessões previstas',pl.prev)+(metas?`<p><b>Metas:</b></p><ul>${metas}</ul>`:''))}
  ${sec('Evolução por sessão (SOAP)',sess)}
  ${al?sec('Alta',kv('Data',fmtD(al.data))+kv('Motivo',al.motivo)+kv('Resumo',al.resumo)+kv('Orientações',al.orient)):''}
  <p style="margin-top:50px;text-align:center">_______________________________<br>${esc(s.nome)}${s.crefito?' — CREFITO '+esc(s.crefito):''}</p></body></html>`;
  abrirPront(pid,h);
}
let PV=null;
function abrirPront(pid,h){PV={pid};$('pvf').srcdoc=h;$('pv').classList.add('on')}
function fecharPront(){$('pv').classList.remove('on');$('pvf').srcdoc='';PV=null}
function imprimirPront(){try{$('pvf').contentWindow.focus();$('pvf').contentWindow.print()}catch(e){toast('Use "Enviar PDF" para salvar')}}
function textoPront(p){
  const s=db.settings,pl=p.plano,L=['*Prontuário — '+p.nome+'*'];
  if(s.nome)L.push(s.nome+(s.crefito?' · CREFITO '+s.crefito:''));
  [['Diagnóstico',p.dxMedico],['Queixa',p.queixa],['HDA',p.hda],['Dx fisioterapêutico',pl.dx],['Objetivo',pl.obj],['Condutas',pl.cond]].forEach(([k,x])=>x&&L.push('*'+k+':* '+x));
  const ev=evaPts(p);if(ev.length)L.push('*EVA:* '+ev.map(e=>e.v).join(' → '));
  L.push('*Sessões realizadas:* '+real(p).length);
  real(p).sort((a,b)=>a.data<b.data?-1:1).slice(-3).forEach(x=>L.push('\n*'+fmtD(x.data)+'*'+['S','O','A','P'].filter(k=>x[k]).map(k=>'\n'+k+': '+x[k]).join('')));
  return L.join('\n')}
function zapTexto(){if(PV)wa('',textoPront(pat(PV.pid)))}
async function zapPdf(){
  if(!PV)return;const p=pat(PV.pid);
  try{toast('⏳ Gerando PDF…');
    if(!window.html2pdf)await new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';e.onload=ok;e.onerror=no;document.head.appendChild(e)});
    const blob=await html2pdf().set({margin:8,html2canvas:{scale:2},jsPDF:{format:'a4'}}).from($('pvf').contentDocument.body).outputPdf('blob');
    const nome='Prontuario-'+p.nome.trim().replace(/\s+/g,'_')+'.pdf',file=new File([blob],nome,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:nome});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();toast('⬇️ PDF baixado — anexe no WhatsApp')}
  }catch(e){if(e&&e.name==='AbortError')return;toast('⚠️ Não foi possível gerar o PDF — enviando texto');zapTexto()}
}
$('lg').src=LOGO_ICON;$('sp-i').src=LOGO_FULL;render();
function fechaSp(){const e=$('sp');if(!e)return;e.classList.add('out');setTimeout(()=>e.remove(),500)}setTimeout(fechaSp,1500);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
