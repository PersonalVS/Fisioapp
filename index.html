<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a08"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Fisioapp"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<title>Fisioapp</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#0a0a08;--sf:#12120e;--card:#1a1912;--card2:#24221a;--bd:#3a3622;--ac:#d4a72c;--act:#0a0a08;--acd:rgba(212,167,44,.13);--tx:#f5f0dc;--tx2:#b5ad8c;--tx3:#7d765c;--red:#ff6b6b;--org:#f2cf4a;--blue:#4fbf6a;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:light){:root{--bg:#f8f4e4;--sf:#fff;--card:#fff;--card2:#f0ead2;--bd:#ddd3a8;--ac:#8a6a0a;--act:#fff;--acd:rgba(138,106,10,.10);--tx:#1a1708;--tx2:#5c5430;--tx3:#93896a;--red:#c62f3f;--org:#a67c00;--blue:#1f7a3a}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);position:fixed;width:100%}
#app{height:100dvh;display:flex;flex-direction:column}
#top{background:var(--sf);border-bottom:1px solid var(--bd);padding:calc(var(--st) + 14px) 14px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#title{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title span{color:var(--ac)}
.bk{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx2);font-size:20px;cursor:pointer;display:none}
#main{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 28px;-webkit-overflow-scrolling:touch}
#nav{background:var(--sf);border-top:1px solid var(--bd);display:flex;padding:7px 0 calc(var(--sb) + 7px);flex-shrink:0}
.ni{flex:1;text-align:center;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--tx3);cursor:pointer;padding:3px}
.ni i{display:block;font-style:normal;font-size:20px;margin-bottom:1px}
.ni.on{color:var(--ac)}
h2{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:4px}
h3{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;margin-bottom:14px}
.sub{font-size:13px;color:var(--tx2);margin-bottom:14px}
.muted{font-size:12px;color:var(--tx3);line-height:1.5}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.ct{font-family:'Syne',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ac);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 10px}
.sv{font-family:'Syne',sans-serif;font-weight:800;font-size:20px}.sl{font-size:10.5px;color:var(--tx2);margin-top:2px}
.pc{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:9px;cursor:pointer}
.pc:active{border-color:var(--ac)}
.av{width:42px;height:42px;border-radius:12px;background:var(--acd);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Syne',sans-serif;flex-shrink:0}
.pn{font-weight:700;font-size:14px}.pm{font-size:11.5px;color:var(--tx2);margin-top:2px}
.chip{display:inline-flex;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--bd);color:var(--tx2);white-space:nowrap}
.chip.ok{color:var(--ac);border-color:var(--ac);background:var(--acd)}.chip.red{color:var(--red);border-color:var(--red)}.chip.blue{color:var(--blue);border-color:var(--blue)}.chip.org{color:var(--org);border-color:var(--org)}
.btn{padding:11px 16px;border-radius:11px;font-weight:700;font-size:13.5px;cursor:pointer;border:none;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.bp{background:var(--ac);color:var(--act)}.bg{background:var(--card2);color:var(--tx2);border:1px solid var(--bd)}.bo{background:transparent;color:var(--ac);border:1px solid var(--ac)}.bd2{background:transparent;color:var(--red);border:1px solid var(--red)}
.bf{width:100%}.bs{padding:6px 11px;font-size:12px;border-radius:8px}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btns .btn{flex:1}
.fg{margin-bottom:11px;flex:1;min-width:0}
label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--tx2);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--tx);font-size:15px;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;line-height:1.5}
input[type=range]{padding:0;height:34px;accent-color:var(--ac)}
input[type=checkbox]{width:auto}
.row{display:flex;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:8px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx3);font-weight:700;font-size:12.5px;cursor:pointer}
.tab.on{background:var(--acd);color:var(--ac);border-color:var(--ac)}
.fl{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto}
.ln{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}.ln:last-child{border:none}
.ln b{text-align:right}.ln span{color:var(--tx2)}
.soap{display:flex;gap:9px;margin-top:7px;font-size:13px;line-height:1.5}
.soap b{width:22px;height:22px;border-radius:6px;background:var(--acd);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:1px}
.soap span{white-space:pre-wrap;color:var(--tx)}
.rowc{background:var(--card2);border:1px solid var(--bd);border-radius:11px;padding:10px;margin-bottom:8px}
.rowc .row{margin-bottom:7px}.rowc .row:last-child{margin:0}
.rowc input,.rowc select{font-size:13.5px;padding:8px 10px}
.x{background:none;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:4px 8px}
.eva{font-family:'Syne',sans-serif;font-size:34px;font-weight:800;line-height:1}
.bar{height:7px;border-radius:5px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
#ov.on{display:flex}
#md{background:var(--sf);border:1px solid var(--bd);border-radius:22px 22px 0 0;padding:20px 16px calc(var(--sb) + 20px);width:100%;max-width:640px;max-height:92vh;overflow-y:auto}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 80px);transform:translateX(-50%);background:var(--card2);border:1px solid var(--bd);padding:9px 16px;border-radius:11px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;white-space:nowrap}
#toast.on{opacity:1}
.empty{text-align:center;padding:40px 10px;color:var(--tx3)}.empty div{font-size:42px;margin-bottom:8px}
.wk{width:100%;min-width:540px;border-collapse:collapse;table-layout:fixed}.wk th,.wk td{border:1px solid var(--bd);padding:2px;vertical-align:top;font-size:10.5px}.wk th{background:var(--card2);font-size:10px;color:var(--tx2);padding:5px 2px}.wk th.td{color:var(--ac)}.wk td.hr{width:38px;color:var(--tx3);text-align:center;font-weight:700;cursor:default}.wk td{height:36px;cursor:pointer}
.ev{border-radius:5px;padding:2px 3px;margin-bottom:2px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid}.ev.rc{background:var(--acd);border-color:var(--ac);color:var(--ac)}.ev.ind{background:rgba(79,191,106,.16);border-color:var(--blue);color:var(--blue)}.ev.ok{background:var(--card2);border-color:var(--tx3);color:var(--tx3)}.ev.red{border-color:var(--red);color:var(--red)}.ev.mut{opacity:.4;border-color:var(--tx3)}
.wn{display:flex;align-items:center;gap:8px;margin-bottom:10px}.wn b{flex:1;text-align:center;font-size:13px}
#pv{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;padding-top:var(--st)}#pv.on{display:flex}.pvb{display:flex;gap:6px;padding:10px 12px;background:var(--sf);border-bottom:1px solid var(--bd)}.pvb .btn{padding:9px 10px;font-size:12.5px}#pvf{flex:1;border:0;background:#fff;width:100%}
.agt{border-collapse:separate;border-spacing:5px 6px;min-width:560px}.agt th{font-size:10.5px;color:var(--tx3);font-weight:700;letter-spacing:.5px;padding:2px 0;text-align:center;width:66px}.agt th.td{color:var(--ac)}.agt th small{display:block;font-size:11px}
.agt td{padding:0;vertical-align:middle}.agt td.nm{position:sticky;left:0;z-index:2;background:var(--bg);min-width:96px;max-width:96px;padding-right:4px}.agt .nm b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agt .nm i{display:block;font-style:normal;font-size:11px;color:var(--tx2);margin-bottom:4px}.agt .nm button{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx3);border-radius:8px;font-size:10px;padding:3px 0;font-family:inherit;cursor:pointer}
.sb{width:100%;min-height:46px;border-radius:10px;border:1.5px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:inherit;font-size:9.5px;font-weight:700;cursor:pointer;background:var(--card)}.sb b{font-size:17px;line-height:1.1}.sb:active{transform:scale(.95)}
.sb.rc{border-color:var(--ac);color:var(--ac);background:var(--acd)}.sb.ind{border-color:#4f9fd4;color:#4f9fd4;background:rgba(79,159,212,.14)}.sb.ok{border-color:var(--blue);color:var(--blue);background:rgba(79,191,106,.16)}.sb.red{border-color:var(--red);color:var(--red);background:rgba(255,107,107,.12)}.sb.mut{border-color:var(--bd);color:var(--tx3);opacity:.6}
.dsh{display:block;text-align:center;color:var(--tx3);padding:14px 0;font-size:14px}
@media(min-width:700px){#main{padding:20px calc(50% - 320px)}}
</style>
</head>
<body>
<div id="app">
  <div id="top"><button class="bk" id="bk" onclick="back()">‹</button><div id="title"></div></div>
  <div id="main"></div>
  <div id="nav">
    <div class="ni" data-v="home" onclick="go('home')"><i>🧑‍⚕️</i>Pacientes</div>
    <div class="ni" data-v="agenda" onclick="go('agenda')"><i>📅</i>Agenda</div>
    <div class="ni" data-v="fin" onclick="go('fin')"><i>💰</i>Financeiro</div>
    <div class="ni" data-v="cfg" onclick="go('cfg')"><i>⚙️</i>Ajustes</div>
  </div>
</div>
<div id="ov" onclick="if(event.target===this)closeModal()"><div id="md"></div></div>
<div id="pv"><div class="pvb"><button class="btn bg" onclick="fecharPront()">✕ Fechar</button><button class="btn bp" style="flex:1" onclick="zapPdf()">📄 Enviar PDF</button><button class="btn bo" onclick="zapTexto()">💬 Texto</button><button class="btn bg" onclick="imprimirPront()">🖨️</button></div><iframe id="pvf"></iframe></div>
<div id="toast"></div>
<datalist id="dl-adm"></datalist><datalist id="dl-tipo"><option value="Ortopédica"><option value="Neurológica"><option value="Esportiva"><option value="Pilates"><option value="RPG"><option value="Domiciliar"><option value="Respiratória"><option value="Reavaliação"></datalist>
<datalist id="dl-forca"></datalist>
<datalist id="dl-testes"></datalist>
<input type="file" id="bkfile" accept=".json" style="display:none" onchange="importar(event)"/>

<script>
// ═══════════ DADOS (ficam só neste aparelho; faça backup em Ajustes) ═══════════
const KEY='pfisio_db_v1';
let db=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.patients){d.recorr=d.recorr||[];return d}}catch(e){}return{patients:[],recorr:[],settings:{nome:'',crefito:'',clinica:'',tel:''}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('⚠️ Não foi possível salvar (armazenamento cheio?)')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const v=id=>($(id)?.value||'').trim();
const brl=n=>'R$ '+(+n||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const iso=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=s=>s?s.split('-').reverse().join('/'):'';
const first=n=>(n||'').split(' ')[0];
const pat=id=>db.patients.find(p=>p.id===id);
const real=p=>p.sessoes.filter(s=>s.status==='realizada');
const usadas=(p,k,ex)=>p.sessoes.filter(s=>s.status==='realizada'&&s.pacoteId===k.id&&s.id!==ex).length;
const pacoteAtivo=p=>p.pacotes.find(k=>usadas(p,k)<k.total);
const devedor=p=>p.sessoes.filter(s=>s.status==='realizada'&&!s.pago&&s.valor>0).reduce((n,s)=>n+s.valor,0)+p.pacotes.filter(k=>!k.pago).reduce((n,k)=>n+k.valor,0);
function idade(n){if(!n)return'';const d=new Date(n+'T00:00'),a=new Date();let i=a.getFullYear()-d.getFullYear();if(a<new Date(a.getFullYear(),d.getMonth(),d.getDate()))i--;return i+' anos'}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function openModal(h){$('md').innerHTML=h;$('ov').classList.add('on')}
function closeModal(){$('ov').classList.remove('on')}
function wa(tel,msg){let n=(tel||'').replace(/\D/g,'');if(n&&n.length<=11)n='55'+n;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank')}
const field=(id,l,val='',type='text',ex='')=>`<div class="fg"><label>${l}</label><input id="${id}" type="${type}" value="${esc(val)}" ${ex}></div>`;
const area=(id,l,val='',rows=3,ph='')=>`<div class="fg"><label>${l}</label><textarea id="${id}" rows="${rows}" placeholder="${esc(ph)}">${esc(val)}</textarea></div>`;
const opts=(arr,cur)=>arr.map(o=>{const[val,lb]=Array.isArray(o)?o:[o,o];return`<option value="${esc(val)}" ${cur===val?'selected':''}>${esc(lb)}</option>`}).join('');

// listas de apoio (sugestões ao digitar)
const ADM_P=[['Ombro — flexão','180'],['Ombro — extensão','60'],['Ombro — abdução','180'],['Ombro — rotação externa','90'],['Ombro — rotação interna','70'],['Cotovelo — flexão','150'],['Punho — flexão','80'],['Punho — extensão','70'],['Quadril — flexão','120'],['Quadril — extensão','30'],['Quadril — abdução','45'],['Quadril — rotação interna','45'],['Quadril — rotação externa','45'],['Joelho — flexão','135'],['Joelho — extensão','0'],['Tornozelo — dorsiflexão','20'],['Tornozelo — flexão plantar','50'],['Coluna cervical — flexão','45'],['Coluna cervical — extensão','45'],['Coluna cervical — rotação','80'],['Coluna lombar — flexão','60'],['Coluna lombar — extensão','25']];
const FORCA_P=['Deltoide','Manguito rotador','Bíceps braquial','Tríceps braquial','Flexores de punho','Iliopsoas','Glúteo médio','Glúteo máximo','Quadríceps','Isquiotibiais','Tibial anterior','Tríceps sural','Abdominais','Extensores de coluna'];
const TESTES_P=['Lachman','Gaveta anterior','Gaveta posterior','McMurray','Stress em valgo','Stress em varo','Neer','Hawkins-Kennedy','Jobe (lata vazia)','Patte','Speed','Phalen','Tinel','Lasègue','Slump','Patrick (FABER)','Thomas','Ober','Trendelenburg','Adams','Spurling','Apley'];
const GRAU=[['0','0 — sem contração'],['1','1 — contração palpável'],['2','2 — move sem gravidade'],['3','3 — vence a gravidade'],['4','4 — vence resistência parcial'],['5','5 — força normal']];
$('dl-adm').innerHTML=ADM_P.map(a=>`<option value="${a[0]}">`).join('');
$('dl-forca').innerHTML=FORCA_P.map(a=>`<option value="${a}">`).join('');
$('dl-testes').innerHTML=TESTES_P.map(a=>`<option value="${a}">`).join('');

// ═══════════ NAVEGAÇÃO ═══════════
const S={view:'home',pid:null,tab:'resumo',q:'',f:'todos',aid:null,ag:'sem',wk:0,sx:null,flt:{rc:1,ind:1,ok:1,red:1},mes:iso().slice(0,7)};
let D=null; // rascunho da avaliação em edição
function go(view,o={}){Object.assign(S,{view},o);render();$('main').scrollTop=0}
function back(){if(S.view==='aval'){D=null;go('pac',{tab:'aval'})}else go('home')}
function render(){
  const m=$('main'),st=m.scrollTop;
  const views={home:viewHome,agenda:viewAgenda,fin:viewFin,cfg:viewCfg,pac:viewPac,aval:viewAval};
  m.innerHTML=views[S.view]();
  m.scrollTop=st;
  const aw=$('agw');if(aw)aw.scrollLeft=S.sx==null?Math.max(0,(+aw.dataset.t-1)*66):S.sx;
  const base=(S.view==='pac'||S.view==='aval')?'home':S.view;
  document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('on',n.dataset.v===base));
  const sub=S.view==='pac'||S.view==='aval';
  $('bk').style.display=sub?'block':'none';
  const t={home:'Fisio<span>app</span>',agenda:'Agenda',fin:'Financeiro',cfg:'Ajustes',pac:esc(pat(S.pid)?.nome||''),aval:S.aid?'Editar avaliação':'Nova avaliação'};
  $('title').innerHTML=t[S.view];
}

// ═══════════ PACIENTES ═══════════
function listHtml(){
  const q=S.q.toLowerCase();
  let l=db.patients.filter(p=>p.nome.toLowerCase().includes(q));
  if(S.f==='ativo')l=l.filter(p=>p.status!=='alta');else if(S.f==='alta')l=l.filter(p=>p.status==='alta');
  l.sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
  if(!l.length)return db.patients.length?`<div class="empty"><div>🔍</div>Nenhum paciente encontrado.</div>`:`<div class="empty"><div>👋</div><b>Bem-vinda ao Fisioapp!</b><p style="margin:8px 0 16px;font-size:13px">Cadastre o primeiro paciente para começar a registrar avaliações e evoluções.</p><button class="btn bp" onclick="pacModal()">➕ Cadastrar paciente</button></div>`;
  return l.map(p=>{const d=devedor(p),n=real(p).length;
    return`<div class="pc" onclick="go('pac',{pid:'${p.id}',tab:'resumo'})"><div class="av">${esc(p.nome.trim()[0]?.toUpperCase()||'?')}</div>
    <div style="flex:1;min-width:0"><div class="pn">${esc(p.nome)}</div><div class="pm">${[idade(p.nasc),p.plano.dx||p.dxMedico].filter(Boolean).map(esc).join(' · ')||'—'}</div>
    <div class="pm">${n} sessão(ões)${d>0?` · <span style="color:var(--red)">${brl(d)} em aberto</span>`:''}</div></div>
    <span class="chip ${p.status==='alta'?'':'ok'}">${p.status==='alta'?'Alta':'Em tratamento'}</span></div>`}).join('');
}
function viewHome(){
  const t=iso();
  const ativos=db.patients.filter(p=>p.status!=='alta').length;
  const hoje=ocorr(t).filter(x=>x.virt||x.s.status==='agendada').length;
  const dev=db.patients.reduce((n,p)=>n+devedor(p),0);
  return`<div class="stats"><div class="stat"><div class="sv" style="color:var(--ac)">${ativos}</div><div class="sl">Em tratamento</div></div>
  <div class="stat"><div class="sv" style="color:var(--blue)">${hoje}</div><div class="sl">Sessões hoje</div></div>
  <div class="stat"><div class="sv" style="color:var(--red);font-size:15px;padding-top:4px">${brl(dev)}</div><div class="sl">A receber</div></div></div>
  <input placeholder="🔍 Buscar paciente..." value="${esc(S.q)}" oninput="S.q=this.value;$('plist').innerHTML=listHtml()" style="margin-bottom:10px"/>

// ═══════════ AVALIAÇÃO (EVA, ADM, força, testes) ═══════════
const evaCor=n=>n>=7?'var(--red)':n>=4?'var(--org)':'var(--ac)';
function evaPts(p){const pts=[];p.avaliacoes.forEach(a=>{if(a.eva!=null&&a.eva!=='')pts.push({d:a.data,v:+a.eva})});real(p).forEach(s=>{if(s.eva!=null)pts.push({d:s.data,v:+s.eva})});return pts.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)}
function chart(p){
  const pts=evaPts(p);if(pts.length<2)return`<div class="muted">O gráfico de dor aparece quando houver 2 ou mais registros de EVA (avaliações ou sessões).</div>`;
  const W=320,H=140,pl=24,pr=10,pt=10,pb=22,x=i=>pl+i*(W-pl-pr)/(pts.length-1),y=n=>pt+(10-n)*(H-pt-pb)/10;
  const dm=s=>s.slice(8)+'/'+s.slice(5,7);
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%">${[0,5,10].map(g=>`<line x1="${pl}" x2="${W-pr}" y1="${y(g)}" y2="${y(g)}" stroke="var(--bd)" stroke-width="1"/><text x="2" y="${y(g)+3}" font-size="9" fill="var(--tx3)">${g}</text>`).join('')}
  <polyline fill="none" stroke="var(--ac)" stroke-width="2.2" stroke-linejoin="round" points="${pts.map((q,i)=>x(i)+','+y(q.v)).join(' ')}"/>
  ${pts.map((q,i)=>`<circle cx="${x(i)}" cy="${y(q.v)}" r="3.5" fill="var(--ac)"/>${pts.length<=10?`<text x="${x(i)}" y="${y(q.v)-7}" text-anchor="middle" font-size="9" fill="var(--tx2)">${q.v}</text>`:''}`).join('')}
  <text x="${pl}" y="${H-5}" font-size="9" fill="var(--tx3)">${dm(pts[0].d)}</text><text x="${W-pr}" y="${H-5}" text-anchor="end" font-size="9" fill="var(--tx3)">${dm(pts[pts.length-1].d)}</text></svg>`;
}
function tabAval(p){
  const l=[...p.avaliacoes].sort((a,b)=>a.data<b.data?1:-1);
  let cmp='';
  if(p.avaliacoes.length>=2){
    const s=[...p.avaliacoes].sort((a,b)=>a.data<b.data?-1:1),f=s[0],u=s[s.length-1];
    const rows=u.adm.map(r=>{const o=f.adm.find(x=>x.mov===r.mov&&x.lado===r.lado);return o?`<div class="ln"><span>${esc(r.mov)} (${esc(r.lado)})</span><b>${esc(o.ativa||'—')}° → ${esc(r.ativa||'—')}°</b></div>`:''}).join('');
    cmp=`<div class="card"><div class="ct">📊 Comparativo ${fmtD(f.data)} → ${fmtD(u.data)}</div>
    <div class="ln"><span>EVA</span><b>${f.eva??'—'} → ${u.eva??'—'}</b></div>${rows||'<div class="muted">Registre os mesmos movimentos de ADM nas duas avaliações para comparar.</div>'}</div>`;
  }
  return`<div class="card"><div class="ct">Dor ao longo do tratamento (EVA)</div>${chart(p)}</div>${cmp}
  <button class="btn bp bf" style="margin-bottom:12px" onclick="novaAval('${p.id}')">➕ ${p.avaliacoes.length?'Nova reavaliação':'Avaliação inicial'}</button>
  ${l.length?l.map(a=>`<div class="card" onclick="editAval('${p.id}','${a.id}')" style="cursor:pointer"><div class="ct">${esc(a.tipo)} · ${fmtD(a.data)} <span class="eva" style="font-size:20px;color:${evaCor(a.eva)}">${a.eva??'—'}<small style="font-size:11px;color:var(--tx3)">/10</small></span></div>
  <div class="muted">${a.adm.length} ADM · ${a.forca.length} força · ${a.testes.length} teste(s)${a.evaLocal?' · dor: '+esc(a.evaLocal):''}</div></div>`).join(''):`<div class="empty"><div>📋</div>Nenhuma avaliação registrada.</div>`}`;
}

// ═══════════ EVOLUÇÃO SOAP / SESSÕES ═══════════
function sessCard(p,s){
  const st={realizada:['Realizada','ok'],agendada:['Agendada','blue'],faltou:['Faltou','red'],cancelada:['Cancelada','']}[s.status];
  const soap=['S','O','A','P'].filter(k=>s[k]).map(k=>`<div class="soap"><b>${k}</b><span>${esc(s[k])}</span></div>`).join('');
  let cob='';if(s.status==='realizada')cob=s.cortesia?'Cortesia':s.pacoteId?'Pacote':s.valor>0?`${brl(s.valor)} · ${s.pago?'pago':'em aberto'}`:'';
  return`<div class="card" onclick="openSessao('${p.id}','${s.id}')" style="cursor:pointer"><div class="ct"><span>${fmtD(s.data)} ${esc(s.hora||'')}</span><span style="display:flex;gap:6px;align-items:center">${s.eva!=null?`<span class="chip" style="color:${evaCor(s.eva)}">EVA ${s.eva}</span>`:''}<span class="chip ${st[1]}">${st[0]}</span></span></div>
  ${soap||'<div class="muted">Sem registro SOAP.</div>'}${cob?`<div class="muted" style="margin-top:8px">💰 ${cob}</div>`:''}</div>`;
}
function tabEvol(p){
  const l=[...p.sessoes].sort((a,b)=>(a.data+(a.hora||''))<(b.data+(b.hora||''))?1:-1);
  return`<div class="btns" style="margin:0 0 12px"><button class="btn bp" onclick="openSessao('${p.id}')">📝 Registrar evolução</button><button class="btn bo" onclick="openSessao('${p.id}',null,true)">📅 Agendar</button></div>
  ${l.length?l.map(s=>sessCard(p,s)).join(''):`<div class="empty"><div>📝</div>Nenhuma sessão registrada.</div>`}`;
}
function openSessao(pid,sid,agendar,quick){
  const p=pat(pid),s=sid?p.sessoes.find(x=>x.id===sid):null;
  const st=s?.status||(agendar?'agendada':'realizada');

  const pkDefault=!s&&p.tipoCobranca==='pacote'?pacoteAtivo(p)?.id:null;
  const cob=s?(s.cortesia?'cortesia':s.pacoteId||'avulsa'):(pkDefault||'avulsa');
  const valor=s&&s.cobr!==undefined?s.valor:(s&&s.valor>0?s.valor:p.valorSessao||'');
  const ultimo=[...real(p)].sort((a,b)=>a.data<b.data?1:-1)[0];
  openModal(`<h3>${s?'Editar':'Nova'} sessão — ${esc(first(p.nome))}</h3>

  ${field('s_tipo','Tipo de atendimento',s?.tipo||ultimo?.tipo||'','text','list="dl-tipo" placeholder="Ex: Ortopédica, Pilates, RPG, Domiciliar"')}${area('s_S','S — Subjetivo',s?.S,3,'Relato do paciente: dor, queixas, evolução desde a última sessão')}
  ${area('s_O','O — Objetivo',s?.O,3,'Achados: ADM, força, edema, testes, observação clínica')}
  ${area('s_A','A — Avaliação',s?.A,2,'Análise e raciocínio clínico: resposta ao tratamento, progresso')}
  ${area('s_P','P — Plano / Conduta',s?.P,3,'Condutas realizadas hoje e plano para as próximas sessões')}
  <div class="fg"><label>EVA da sessão</label><select id="s_eva">${opts([['','— não registrar'],...Array.from({length:11},(_,i)=>[String(i),String(i)])],s?.eva!=null?String(s.eva):'')}</select></div>
  <div class="card" style="background:var(--card2)"><div class="ct">💰 Cobrança</div>
  <div class="fg"><label>Forma</label><select id="s_cobr" onchange="$('s_vw').style.display=this.value==='avulsa'?'block':'none'">
  <option value="avulsa" ${cob==='avulsa'?'selected':''}>Sessão avulsa</option>
  ${pks.map(k=>`<option value="${k.id}" ${cob===k.id?'selected':''}>Pacote: ${esc(k.nome)} (restam ${k.total-usadas(p,k,sid)})</option>`).join('')}

function salvarSessao(pid,sid){
  const p=pat(pid),old=sid?p.sessoes.find(x=>x.id===sid):null;
  if(!v('s_data'))return toast('⚠️ Informe a data');
  const status=v('s_st');
  const r={id:old?.id||uid(),data:v('s_data'),hora:v('s_hora'),status,S:v('s_S'),O:v('s_O'),A:v('s_A'),P:v('s_P'),eva:v('s_eva')===''?null:+v('s_eva'),tipo:v('s_tipo')};
  if(status==='realizada'){
    const c=v('s_cobr');
    if(c==='cortesia'){r.cortesia=true;r.valor=0;r.pago=true}
    else if(c==='avulsa'){r.valor=+v('s_valor')||0;r.pago=$('s_pago').checked;r.forma=v('s_forma');if(r.pago)r.pagoEm=old?.pagoEm||iso()}
    else{r.pacoteId=c;r.valor=0;r.pago=true}
  }else{r.valor=0;r.pago=true;r.eva=null}
  if(old)Object.assign(old,{pacoteId:undefined,cortesia:undefined,pagoEm:undefined,forma:undefined},r);else p.sessoes.push(r);
  save();closeModal();render();toast('✅ Sessão salva');
}
function excluirSessao(pid,sid){if(!confirm('Excluir esta sessão?'))return;const p=pat(pid);const x=p.sessoes.find(q=>q.id===sid);if(x&&x.rec){const r=db.recorr.find(q=>q.id===x.rec);if(r)(r.skip=r.skip||[]).push(x.data)}p.sessoes=p.sessoes.filter(s=>s.id!==sid);save();closeModal();render()}

const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const mesAdd=(m,n)=>iso(new Date(+m.slice(0,4),+m.slice(5)-1+n,1)).slice(0,7);
const mesLb=m=>MESES[+m.slice(5)-1]+'/'+m.slice(2,4);
const kfmt=n=>n>=1000?(n/1000).toFixed(1).replace('.',',')+'k':String(Math.round(n));
function viewFin(){
  const m=S.mes;let rec=[];db.patients.forEach(p=>rec=rec.concat(recebimentos(p)));
  const sum=mm=>rec.filter(r=>r.d.startsWith(mm)).reduce((n,r)=>n+r.v,0);
  const rm=rec.filter(r=>r.d.startsWith(m)).sort((a,b)=>a.d<b.d?1:-1);
  const total=sum(m),ant=sum(mesAdd(m,-1)),dev=db.patients.map(p=>({p,d:devedor(p)})).filter(x=>x.d>0).sort((a,b)=>b.d-a.d);

  const ms=[-5,-4,-3,-2,-1,0].map(i=>mesAdd(m,i)),vals=ms.map(sum),mx=Math.max(...vals,1);

  return`<div class="wn"><button class="btn bg bs" onclick="S.mes=mesAdd(S.mes,-1);render()">‹</button><b>${MESES[+m.slice(5)-1]} de ${m.slice(0,4)}</b><button class="btn bg bs" onclick="S.mes=mesAdd(S.mes,1);render()">›</button></div>
  <div class="stats"><div class="stat"><div class="sv" style="color:var(--ac);font-size:16px;padding-top:2px">${brl(total)}</div><div class="sl">Recebido${varp!==null?` · <span style="color:${varp>=0?'var(--blue)':'var(--red)'}">${varp>=0?'▲':'▼'}${Math.abs(varp)}%</span>`:''}</div></div>
  <div class="stat"><div class="sv" style="color:var(--red);font-size:16px;padding-top:2px">${brl(dev.reduce((n,x)=>n+x.d,0))}</div><div class="sl">A receber (total)</div></div>

  <div class="card"><div class="ct">Recebido nos últimos 6 meses</div><div style="display:flex;align-items:flex-end;height:120px">${ms.map((x,i)=>`<div style="flex:1;text-align:center;font-size:10px;color:var(--tx2)">${vals[i]?kfmt(vals[i]):''}<div style="height:${Math.max(3,vals[i]/mx*80)}px;background:${x===m?'var(--ac)':'var(--bd)'};border-radius:5px 5px 0 0;margin:2px 5px 0"></div><div style="color:var(--tx3);margin-top:3px">${mesLb(x)}</div></div>`).join('')}</div></div>
  <div class="card"><div class="ct">Por tipo de atendimento</div>${share(grp(r=>r.k))}<div class="muted">Pacotes entram juntos, na data do pagamento. Defina o tipo ao registrar cada sessão.</div></div>
  <div class="card"><div class="ct">Por forma de pagamento</div>${share(grp(r=>r.f||'Não informada'))}</div>

  <div class="card"><div class="ct">Pacientes com valores em aberto</div>${dev.length?dev.map(({p,d})=>`<div class="ln" style="align-items:center"><span style="cursor:pointer;color:var(--tx)" onclick="go('pac',{pid:'${p.id}',tab:'fin'})">${esc(p.nome)}</span><b style="color:var(--red)">${brl(d)}</b>

  <div class="card"><div class="ct">Recebimentos do mês</div>${rm.length?rm.map(r=>`<div class="ln"><span>${fmtD(r.d)} · ${esc(r.n)}<br><small style="color:var(--tx3)">${esc(r.t)} · ${esc(r.k)}${r.f?' · '+esc(r.f):''}</small></span><b>${brl(r.v)}</b></div>`).join(''):`<div class="muted">Nenhum recebimento neste mês.</div>`}</div>`;
}

function viewLista(){

const DIAS=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const segunda=o=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);return d};
function ocorr(d){
  const dow=new Date(d+'T12:00').getDay(),out=[],seen=new Set();
  db.patients.forEach(p=>p.sessoes.forEach(s=>{if(s.data===d){out.push({p,s,h:s.hora||'',rec:!!s.rec});if(s.rec)seen.add(s.rec)}}));
  db.recorr.forEach(r=>{const p=pat(r.pid);if(!p||p.status==='alta'||!r.dias.includes(dow)||d<r.ini||(r.fim&&d>r.fim)||(r.skip||[]).includes(d)||seen.has(r.id))return;out.push({p,r,h:r.hora,rec:true,virt:true})});
  return out}
function viewAgenda(){
  const tb=`<div class="tabs">${[['sem','📆 Semana'],['lista','📋 Lista']].map(([k,l])=>`<span class="tab ${S.ag===k?'on':''}" onclick="S.ag='${k}';render()">${l}</span>`).join('')}</div>`;
  return tb+(S.ag==='lista'?viewLista():viewSemana())}
function cat(x){const st=x.s?x.s.status:'agendada';return st==='realizada'?'ok':st==='faltou'?'red':st==='cancelada'?'mut':x.rec?'rc':'ind'}
function viewSemana(){
  const m=segunda(S.wk),t=iso(),dias=[0,1,2,3,4,5,6].map(i=>{const d=new Date(m);d.setDate(m.getDate()+i);return iso(d)}),it=dias.map(ocorr);
  const R={};it.forEach((l,i)=>l.forEach(x=>{const k=x.p.id+'|'+x.h;(R[k]=R[k]||{p:x.p,h:x.h,c:Array(7).fill(null)}).c[i]=x}));
  const vis=x=>x&&(cat(x)==='mut'||S.flt[cat(x)]);
  const rows=Object.values(R).filter(r=>r.c.some(vis)).sort((a,b)=>a.h<b.h?-1:a.h>b.h?1:a.p.nome.localeCompare(b.p.nome,'pt'));
  const ic={rc:'🔁',ind:'📅',ok:'✅',red:'❌',mut:'🚫'},lb={rc:'Agendado',ind:'Agendado',ok:'Presente',red:'Falta',mut:'Cancelada'};
  const btn=(x,d)=>{const c=cat(x);return`<button class="sb ${c}" onclick="cic('${x.p.id}','${x.s?x.s.id:''}','${x.r?x.r.id:''}','${d}')"><b>${ic[c]}</b>${lb[c]}${x.rec&&c!=='rc'?' ↻':''}</button>`};
  const a=dias[0],b=dias[6],ti=dias.indexOf(t);
  const fl=(k,l,cl,sty)=>`<span class="chip ${cl}" style="cursor:pointer;opacity:${S.flt[k]?1:.35};${sty||''}" onclick="S.flt.${k}=S.flt.${k}?0:1;render()">${l}</span>`;
  const dn=r=>r.dias.map(n=>DIAS[n]).join('·')+' '+r.hora;
  return`<div class="card" style="padding:10px 12px"><div class="ct" style="margin:0"><span>📅 ${S.wk===0?'Semana atual':'Semana'}</span><span style="display:flex;gap:6px;align-items:center;color:var(--tx2);font-family:'DM Sans'"><button class="btn bg bs" onclick="S.wk--;S.sx=null;render()">‹</button>${a.slice(8)}/${a.slice(5,7)} – ${b.slice(8)}/${b.slice(5,7)}<button class="btn bg bs" onclick="S.wk++;S.sx=null;render()">›</button>${S.wk?`<button class="btn bo bs" onclick="S.wk=0;S.sx=null;render()">Hoje</button>`:''}</span></div></div>
  <div class="fl">${fl('rc','↻ Recorrentes','ok')}${fl('ind','Individual','','color:#4f9fd4;border-color:#4f9fd4')}${fl('ok','Realizado','blue')}${fl('red','Faltou','red')}</div>
  ${rows.length?`<div id="agw" data-t="${ti<0?0:ti}" style="overflow-x:auto;margin:0 -4px 10px" onscroll="S.sx=this.scrollLeft"><table class="agt"><tr><th style="text-align:left;width:96px">PACIENTE</th>${dias.map((d,i)=>`<th class="${d===t?'td':''}">${DIAS[(i+1)%7]}<small>${d.slice(8)}</small></th>`).join('')}</tr>
  ${rows.map(r=>`<tr><td class="nm"><b>${esc(first(r.p.nome))}</b><i>${r.h||'sem hora'}</i><button onclick="cfgRow('${r.p.id}','${r.h}')">⚙ Config</button></td>${r.c.map((x,i)=>`<td>${vis(x)?btn(x,dias[i]):x?'<span class="dsh">·</span>':`<span class="dsh" onclick="agendarModal('${dias[i]}','${r.h}','${r.p.id}')">—</span>`}</td>`).join('')}</tr>`).join('')}</table></div>
  <div class="muted" style="margin-bottom:12px">Toque no botão para alternar: Agendado → Presente → Falta. Toque em “—” para incluir uma reposição naquele dia.</div>`
  :`<div class="empty"><div>📆</div>Nenhum atendimento nesta semana${Object.keys(R).length?' com os filtros atuais':''}.</div>`}
  <button class="btn bp bf" style="margin-bottom:12px" onclick="agendarModal()">📅 Agendar (individual ou recorrente)</button>
  <div class="card"><div class="ct">↻ Atendimentos recorrentes</div>${db.recorr.length?db.recorr.map(r=>{const p=pat(r.pid);return p?`<div class="ln" style="align-items:center"><span style="color:var(--tx)">${esc(p.nome)}<br><small style="color:var(--tx3)">${dn(r)}${r.fim?' · até '+fmtD(r.fim):''}</small></span><button class="x" onclick="rmRec('${r.id}')">✕</button></div>`:''}).join(''):'<div class="muted">Nenhum. Ex.: Sr. João — SEG·QUA·SEX às 08:00.</div>'}</div>`}
function setSt(p,s,st){
  Object.assign(s,{status:st,pacoteId:undefined,cortesia:undefined,pagoEm:undefined,forma:undefined,valor:0,pago:true});
  if(st==='realizada'){
    const k=p.tipoCobranca==='pacote'?pacoteAtivo(p):null;
    if(k)s.pacoteId=k.id;else if(p.valorSessao>0){s.valor=p.valorSessao;s.pago=false}
    if(!s.tipo){const u=real(p).filter(x=>x.tipo).sort((a,b)=>a.data<b.data?1:-1)[0];if(u)s.tipo=u.tipo}
  }else s.eva=null}
function cic(pid,sid,rid,d){
  const p=pat(pid);let s=sid?p.sessoes.find(x=>x.id===sid):null;const cur=s?s.status:'agendada';
  if(cur==='realizada'&&s.pago&&s.valor>0&&s.pagoEm&&!confirm('Esta sessão já tem pagamento registrado. Alterar mesmo assim?'))return;
  if(!s){const r=db.recorr.find(x=>x.id===rid);s={id:uid(),data:d,hora:r.hora,status:'agendada',valor:0,pago:true,rec:rid};p.sessoes.push(s)}
  const nx=cur==='realizada'?'faltou':cur==='faltou'?'agendada':'realizada';
  setSt(p,s,nx);save();render();toast(nx==='realizada'?'✅ Presença registrada':nx==='faltou'?'❌ Falta registrada':'Voltou para agendado')}
function cfgRow(pid,h){const p=pat(pid),rs=db.recorr.filter(r=>r.pid===pid&&r.hora===h);
  openModal(`<h3>${esc(p.nome)}</h3><div class="muted" style="margin-bottom:12px">${h||'sem hora'}${rs.map(r=>' · ↻ '+r.dias.map(n=>DIAS[n]).join('·')).join('')}</div><div class="btns" style="flex-direction:column">
  <button class="btn bp" onclick="closeModal();go('pac',{pid:'${pid}',tab:'evol'})">📝 Evolução / cobrança das sessões</button>
  ${rs.map(r=>`<button class="btn bd2" onclick="rmRec('${r.id}')">Encerrar recorrência ${r.dias.map(n=>DIAS[n]).join('·')}</button>`).join('')}
  <button class="btn bg" onclick="closeModal()">Fechar</button></div>`)}
function evS(pid,sid){const s=pat(pid).sessoes.find(x=>x.id===sid);if(s.status==='agendada')registrar(pid,sid);else openSessao(pid,sid)}
function evV(rid,d){const r=db.recorr.find(x=>x.id===rid),p=pat(r.pid);
  openModal(`<h3>${esc(p.nome)}</h3><div class="muted" style="margin-bottom:12px">↻ ${fmtD(d)} às ${esc(r.hora)}</div><div class="btns" style="flex-direction:column">
  <button class="btn bp" onclick="matV('${rid}','${d}','reg')">📝 Registrar sessão</button><button class="btn bg" onclick="matV('${rid}','${d}','falta')">Faltou</button>
  <button class="btn bg" onclick="matV('${rid}','${d}','skip')">Desmarcar só este dia</button><button class="btn bd2" onclick="rmRec('${rid}')">Encerrar recorrência</button><button class="btn bg" onclick="closeModal()">Fechar</button></div>`)}
function matV(rid,d,a){const r=db.recorr.find(x=>x.id===rid),p=pat(r.pid);
  if(a==='skip'){(r.skip=r.skip||[]).push(d);save();closeModal();return render()}
  const s={id:uid(),data:d,hora:r.hora,status:a==='falta'?'faltou':'agendada',valor:0,pago:true,rec:rid};p.sessoes.push(s);save();
  if(a==='reg')registrar(p.id,s.id);else{closeModal();render();toast('Falta registrada')}}
function rmRec(id){if(!confirm('Encerrar esta recorrência? Sessões já registradas são mantidas.'))return;db.recorr=db.recorr.filter(r=>r.id!==id);save();closeModal();render()}
function registrar(pid,sid){const p=pat(pid),s=p.sessoes.find(x=>x.id===sid);s.status='realizada';openSessao(pid,sid);s.status='agendada'}
function marcaFalta(pid,sid){const s=pat(pid).sessoes.find(x=>x.id===sid);s.status='faltou';save();render();toast('Falta registrada')}
function agendarModal(d,h,pid){
  const ps=db.patients.filter(p=>p.status!=='alta');if(!ps.length)return toast('Cadastre um paciente primeiro');
  const dow=new Date((d||iso())+'T12:00').getDay();
  openModal(`<h3>Agendar</h3><div class="fg"><label>Paciente</label><select id="g_p">${ps.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></div>
  <div class="fg"><label>Tipo</label><select id="g_t" onchange="$('g_i').style.display=this.value==='i'?'block':'none';$('g_r').style.display=this.value==='r'?'block':'none'"><option value="i">Individual (data única)</option><option value="r">Recorrente (dias da semana)</option></select></div>
  <div id="g_i">${field('g_d','Data',d||iso(),'date')}</div>
  <div id="g_r" style="display:none"><label>Dias da semana</label><div class="fl">${[1,2,3,4,5,6,0].map(n=>`<label class="tab" style="margin:0;display:flex;gap:5px;align-items:center;text-transform:none;letter-spacing:0"><input type="checkbox" class="g_dia" value="${n}" ${n===dow?'checked':''}>${DIAS[n]}</label>`).join('')}</div>
  <div class="row">${field('g_ini','A partir de',d||iso(),'date')}${field('g_fim','Até (opcional)','','date')}</div></div>
  ${field('g_h','Hora',h||'','time')}
  <div class="btns"><button class="btn bg" onclick="closeModal()">Cancelar</button><button class="btn bp" style="flex:2" onclick="salvarAgenda()">Agendar</button></div>`);
}
function salvarAgenda(){
  const pid=v('g_p'),h=v('g_h');
  if(v('g_t')==='r'){const dias=[...document.querySelectorAll('.g_dia:checked')].map(x=>+x.value);if(!dias.length)return toast('⚠️ Marque os dias');if(!h)return toast('⚠️ Informe a hora');
    db.recorr.push({id:uid(),pid,dias,hora:h,ini:v('g_ini')||iso(),fim:v('g_fim'),skip:[]});save();closeModal();render();return toast('✅ Recorrência criada')}
  if(!v('g_d'))return toast('⚠️ Informe a data');
  pat(pid).sessoes.push({id:uid(),data:v('g_d'),hora:h,status:'agendada',valor:0,pago:true});save();closeModal();render();toast('✅ Sessão agendada')}

// ═══════════ AJUSTES / BACKUP / PRONTUÁRIO PDF ═══════════
function viewCfg(){
  const s=db.settings;
  return`<div class="card"><div class="ct">Profissional (aparece no prontuário impresso)</div>${field('t_nome','Nome',s.nome)}<div class="row">${field('t_cr','CREFITO',s.crefito)}${field('t_tel','Telefone',s.tel,'tel')}</div>${field('t_cl','Clínica / consultório',s.clinica)}
  <button class="btn bp bf" onclick="salvarCfg()">💾 Salvar</button></div>
  <div class="card"><div class="ct">🛡️ Backup dos dados</div><div class="muted" style="margin-bottom:12px">Os dados ficam guardados somente neste aparelho/navegador. Baixe um backup com frequência e guarde em local seguro — se o navegador for limpo ou o celular trocado, sem backup tudo se perde.</div>
  <div class="btns" style="margin:0"><button class="btn bp" onclick="exportar()">⬇️ Baixar backup</button><button class="btn bg" onclick="$('bkfile').click()">⬆️ Restaurar</button></div></div>
  <div class="card"><div class="ct">🔒 Privacidade (LGPD)</div><div class="muted">Prontuários são dados sensíveis de saúde. Mantenha o aparelho protegido por senha/biometria, guarde os backups com cuidado e colete o consentimento do paciente (campo disponível no cadastro).</div></div>`;
}
function salvarCfg(){db.settings={nome:v('t_nome'),crefito:v('t_cr'),tel:v('t_tel'),clinica:v('t_cl')};save();toast('✅ Salvo')}
function exportar(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fisioapp-backup-'+iso()+'.json';document.body.appendChild(a);a.click();a.remove();toast('⬇️ Backup baixado')}
async function importar(e){const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(!d.patients)throw 0;if(!confirm('Restaurar substitui TODOS os dados atuais pelos do arquivo. Continuar?'))return;db=d;db.recorr=db.recorr||[];save();toast('✅ Backup restaurado');go('home')}catch(x){toast('❌ Arquivo inválido')}}
function imprimir(pid){
  const p=pat(pid),s=db.settings,pl=p.plano;
  const sec=(t,b)=>b?`<h2>${t}</h2>${b}`:'';
  const kv=(k,val)=>val?`<p><b>${k}:</b> ${esc(val)}</p>`:'';
  const avs=[...p.avaliacoes].sort((a,b)=>a.data<b.data?-1:1).map(a=>`<h3>${esc(a.tipo)} — ${fmtD(a.data)} · EVA ${a.eva??'—'}/10 ${esc(a.evaLocal)}</h3>${kv('Inspeção',a.inspecao)}${kv('Palpação',a.palpacao)}
  ${a.adm.length?`<table><tr><th>ADM</th><th>Lado</th><th>Ativa</th><th>Passiva</th><th>Ref.</th></tr>${a.adm.map(r=>`<tr><td>${esc(r.mov)}${r.dor?' (dor)':''}</td><td>${esc(r.lado)}</td><td>${esc(r.ativa)}°</td><td>${esc(r.passiva)}°</td><td>${esc(r.ref)}°</td></tr>`).join('')}</table>`:''}
  ${a.forca.length?`<table><tr><th>Força</th><th>Lado</th><th>Grau</th></tr>${a.forca.map(r=>`<tr><td>${esc(r.musculo)}</td><td>${esc(r.lado)}</td><td>${esc(r.grau)}/5</td></tr>`).join('')}</table>`:''}
  ${a.testes.length?`<table><tr><th>Teste</th><th>Lado</th><th>Resultado</th><th>Obs.</th></tr>${a.testes.map(r=>`<tr><td>${esc(r.nome)}</td><td>${esc(r.lado)}</td><td>${esc(r.res)}</td><td>${esc(r.obs)}</td></tr>`).join('')}</table>`:''}${kv('Funcional',a.funcional)}${kv('Obs.',a.obs)}`).join('');
  const sess=[...real(p)].sort((a,b)=>a.data<b.data?-1:1).map(x=>`<div class="s"><b>${fmtD(x.data)} ${esc(x.hora||'')}${x.eva!=null?' · EVA '+x.eva:''}</b>${['S','O','A','P'].filter(k=>x[k]).map(k=>`<p><b>${k}:</b> ${esc(x[k])}</p>`).join('')}</div>`).join('');
  const metas=pl.metas.map(g=>`<li>${esc(g.texto)} — <i>${MS[g.status][0]}</i></li>`).join('');
  const al=pl.alta;
  const h=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Prontuário — ${esc(p.nome)}</title><style>body{font-family:Arial,sans-serif;color:#111;max-width:800px;margin:0 auto;padding:24px;font-size:13px;line-height:1.5}h1{font-size:20px;margin-bottom:2px}h2{font-size:14px;border-bottom:2px solid #8a6a0a;color:#8a6a0a;margin:22px 0 8px;padding-bottom:3px;text-transform:uppercase}h3{font-size:13px;margin:12px 0 4px}table{width:100%;border-collapse:collapse;margin:6px 0}th,td{border:1px solid #ccc;padding:4px 7px;text-align:left;font-size:12px}th{background:#f6f0d6}p{margin:3px 0}.s{border-left:3px solid #8a6a0a;padding-left:10px;margin:10px 0;page-break-inside:avoid}.hd{display:flex;justify-content:space-between;border-bottom:1px solid #999;padding-bottom:8px}.bt{margin-bottom:14px}@media print{.bt{display:none}}</style></head><body>
  
  <div class="hd"><div><h1>${esc(s.clinica||'Prontuário de Fisioterapia')}</h1><div>${esc(s.nome)}${s.crefito?' · CREFITO '+esc(s.crefito):''}${s.tel?' · '+esc(s.tel):''}</div></div><div style="text-align:right">Emitido em ${fmtD(iso())}</div></div>
  <h2>Identificação</h2><p><b>${esc(p.nome)}</b> ${idade(p.nasc)?'· '+idade(p.nasc):''} ${p.sexo?'· '+esc(p.sexo):''}</p>${kv('Profissão',p.prof)}${kv('Telefone',p.tel)}${kv('Diagnóstico médico',p.dxMedico)}${kv('Encaminhador',p.medico)}${kv('Alertas',p.alerta)}
  ${sec('Anamnese',kv('Queixa principal',p.queixa)+kv('HDA',p.hda)+kv('Antecedentes',p.ant)+kv('Medicamentos',p.meds))}
  ${sec('Avaliações',avs)}
  ${sec('Plano de tratamento',kv('Diagnóstico fisioterapêutico',pl.dx)+kv('Objetivo geral',pl.obj)+kv('Condutas',pl.cond)+kv('Frequência',pl.freq?pl.freq+'x/semana':'')+kv('Sessões previstas',pl.prev)+(metas?`<p><b>Metas:</b></p><ul>${metas}</ul>`:''))}
  ${sec('Evolução por sessão (SOAP)',sess)}
  ${al?sec('Alta',kv('Data',fmtD(al.data))+kv('Motivo',al.motivo)+kv('Resumo',al.resumo)+kv('Orientações',al.orient)):''}
  <p style="margin-top:50px;text-align:center">_______________________________<br>${esc(s.nome)}${s.crefito?' — CREFITO '+esc(s.crefito):''}</p></body></html>`;
  abrirPront(pid,h);
}
let PV=null;
function abrirPront(pid,h){PV={pid};$('pvf').srcdoc=h;$('pv').classList.add('on')}
function fecharPront(){$('pv').classList.remove('on');$('pvf').srcdoc='';PV=null}
function imprimirPront(){try{$('pvf').contentWindow.focus();$('pvf').contentWindow.print()}catch(e){toast('Use "Enviar PDF" para salvar')}}
function textoPront(p){
  const s=db.settings,pl=p.plano,L=['*Prontuário — '+p.nome+'*'];
  if(s.nome)L.push(s.nome+(s.crefito?' · CREFITO '+s.crefito:''));
  [['Diagnóstico',p.dxMedico],['Queixa',p.queixa],['HDA',p.hda],['Dx fisioterapêutico',pl.dx],['Objetivo',pl.obj],['Condutas',pl.cond]].forEach(([k,x])=>x&&L.push('*'+k+':* '+x));
  const ev=evaPts(p);if(ev.length)L.push('*EVA:* '+ev.map(e=>e.v).join(' → '));
  L.push('*Sessões realizadas:* '+real(p).length);
  real(p).sort((a,b)=>a.data<b.data?-1:1).slice(-3).forEach(x=>L.push('\n*'+fmtD(x.data)+'*'+['S','O','A','P'].filter(k=>x[k]).map(k=>'\n'+k+': '+x[k]).join('')));
  return L.join('\n')}
function zapTexto(){if(PV)wa('',textoPront(pat(PV.pid)))}
async function zapPdf(){
  if(!PV)return;const p=pat(PV.pid);
  try{toast('⏳ Gerando PDF…');
    if(!window.html2pdf)await new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';e.onload=ok;e.onerror=no;document.head.appendChild(e)});
    const blob=await html2pdf().set({margin:8,html2canvas:{scale:2},jsPDF:{format:'a4'}}).from($('pvf').contentDocument.body).outputPdf('blob');
    const nome='Prontuario-'+p.nome.trim().replace(/\s+/g,'_')+'.pdf',file=new File([blob],nome,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:nome});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();toast('⬇️ PDF baixado — anexe no WhatsApp')}
  }catch(e){if(e&&e.name==='AbortError')return;toast('⚠️ Não foi possível gerar o PDF — enviando texto');zapTexto()}
}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
